  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

a(242,194,0,0.55); color:#ffd63d; font-size:13px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; padding:7px 14px; border-radius:999px\">Candidata a Deputada Federal por Santa Catarina<\u002Fspan>\n        <h1 class=\"h1\" style=\"margin:0; font-size:58px; line-height:1.03; font-weight:900; letter-spacing:-1.6px; text-wrap:balance\">A voz da AMUREL em Brasília é a <span style=\"color:#f2c200\">7712<\u002Fspan><\u002Fh1>\n        <p class=\"lead\" style=\"margin:0; font-size:19px; line-height:1.55; color:rgba(255,255,255,0.86); max-width:560px; text-wrap:pretty\">Engenheira, tubaronense, cansei do que fica pra depois. Levar as pautas da nossa região — saúde, inclusão e infraestrutura — pra quem decide.<\u002Fp>\n        <div class=\"cta-row\" style=\"display:flex; flex-wrap:wrap; gap:14px; margin-top:6px\">\n          <button class=\"cta-btn\" sc-camel-on-click=\"{{ compartilhar }}\" style=\"background:#f2c200; color:#0c1a30; border:none; font-family:inherit; font-weight:800; font-size:16px; padding:16px 26px; border-radius:10px; cursor:pointer\" style-hover=\"background:#ffd63d\">{{ shareLabel }}<\u002Fbutton>\n          <a class=\"cta-btn\" href=\"#propostas\" style=\"border:2px solid rgba(255,255,255,0.7); color:#ffffff; font-weight:800; font-size:16px; padding:14px 26px; border-radius:10px\" style-hover=\"background:rgba(255,255,255,0.12)\">Ver propostas<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative\">\n        <div class=\"hero-photo\" style=\"border-radius:18px; overflow:hidden; box-shadow:0 26px 60px rgba(4,16,40,0.45); aspect-ratio:4/5; background:#0a2a5e\">\n          <img src=\"e9e9087f-506a-4adc-a77c-850ade857ce5\" alt=\"Engenheira Silvana Silvano, candidata a Deputada Federal 7712\" style=\"width:100%; height:100%; object-fit:cover; object-position:44% center; display:block\">\n        <\u002Fdiv>\n        <div class=\"badge-7712\" style=\"position:absolute; left:-14px; bottom:26px; background:#f2c200; color:#0a2a5e; border-radius:14px; padding:12px 18px; box-shadow:0 14px 30px rgba(4,16,40,0.4); text-align:center\">\n          <div style=\"font-size:30px; font-weight:900; line-height:1; letter-spacing:-0.5px\">7712<\u002Fdiv>\n          <div style=\"font-size:12px; font-weight:800; letter-spacing:2px; margin-top:3px\">VOTE<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0c1a30\">\n      <div class=\"chapa\" style=\"max-width:1180px; margin:0 auto; padding:16px 18px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; font-size:14px; font-weight:700; color:rgba(255,255,255,0.82)\">\n        <span>Jorginho Mello — Governador <span style=\"color:#f2c200\">22<\u002Fspan><\u002Fspan>\n        <span style=\"opacity:0.35\">·<\u002Fspan>\n        <span>Vice Adriano Silva<\u002Fspan>\n        <span style=\"opacity:0.35\">·<\u002Fspan>\n        <span>Solidariedade <span style=\"color:#f2c200\">77<\u002Fspan><\u002Fspan>\n        <span style=\"opacity:0.35\">·<\u002Fspan>\n        <span style=\"color:#ffd63d\">Por SC e por toda AMUREL<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"sobre\" class=\"sec\" style=\"background:#ffffff; padding:86px 22px\">\n    <div style=\"max-width:880px; margin:0 auto; display:flex; flex-direction:column; gap:24px\">\n      <span style=\"color:#12469a; font-size:13px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase\">Sobre<\u002Fspan>\n      <h2 class=\"h2\" style=\"margin:0; font-size:40px; line-height:1.1; font-weight:900; letter-spacing:-1.1px; color:#0c1a30; text-wrap:balance\">Engenheira, tubaronense, com os pés na região<\u002Fh2>\n      <p class=\"lead\" style=\"margin:0; font-size:19px; line-height:1.65; color:#5c6b85; text-wrap:pretty\">Silvana Silvano é engenheira e vive em Tubarão, no coração da AMUREL. Depois de anos acompanhando de perto as dificuldades de quem cuida de família, de quem precisa viajar pra ser atendido pelo SUS e de quem vê a região ficar de fora dos grandes investimentos, decidiu que era hora de levar essa realidade direto pra Brasília.<\u002Fp>\n      <blockquote class=\"quote\" style=\"margin:14px 0 0; background:#f6f8fd; border-left:6px solid #f2c200; border-radius:0 12px 12px 0; padding:26px 30px; font-size:23px; line-height:1.4; font-weight:800; color:#0a2a5e; letter-spacing:-0.4px; text-wrap:pretty\">“Cansei do que fica pra depois. Nossa região precisa de alguém que leve a nossa voz pra Brasília.”<\u002Fblockquote>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"propostas\" class=\"sec\" style=\"background:#f6f8fd; padding:86px 22px\">\n    <div style=\"max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:38px\">\n      <div style=\"display:flex; flex-direction:column; gap:14px; max-width:720px\">\n        <span style=\"color:#12469a; font-size:13px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase\">Propostas<\u002Fspan>\n        <h2 class=\"h2\" style=\"margin:0; font-size:40px; line-height:1.1; font-weight:900; letter-spacing:-1.1px; color:#0c1a30\">Três compromissos com a nossa gente<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"cards-grid\" style=\"display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px\">\n        <article style=\"background:#ffffff; border:1px solid #e3e9f6; border-radius:16px; padding:32px 28px; display:flex; flex-direction:column; gap:14px; box-shadow:0 6px 22px rgba(12,26,48,0.05)\" class=\"card\">\n          <span style=\"width:44px; height:44px; border-radius:10px; background:#f2c200; color:#0a2a5e; font-weight:900; font-size:19px; display:flex; align-items:center; justify-content:center\">01<\u002Fspan>\n          <h3 style=\"margin:0; font-size:22px; line-height:1.22; font-weight:900; color:#0a2a5e; letter-spacing:-0.5px\">Quem cuida também precisa de cuidado<\u002Fh3>\n          <p style=\"margin:0; font-size:16px; line-height:1.6; color:#5c6b85; text-wrap:pretty\">Apoio preparado nas escolas, laudo com prazo definido, cidades mais acessíveis e amparo pra quem larga o emprego para cuidar de um familiar com deficiência.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"background:#ffffff; border:1px solid #e3e9f6; border-radius:16px; padding:32px 28px; display:flex; flex-direction:column; gap:14px; box-shadow:0 6px 22px rgba(12,26,48,0.05)\" class=\"card\">\n          <span style=\"width:44px; height:44px; border-radius:10px; background:#f2c200; color:#0a2a5e; font-weight:900; font-size:19px; display:flex; align-items:center; justify-content:center\">02<\u002Fspan>\n          <h3 style=\"margin:0; font-size:22px; line-height:1.22; font-weight:900; color:#0a2a5e; letter-spacing:-0.5px\">Saúde sem viajar e sem pagar caro<\u002Fh3>\n          <p style=\"margin:0; font-size:16px; line-height:1.6; color:#5c6b85; text-wrap:pretty\">Santa Catarina tem seis centros de reabilitação pelo SUS — nenhum na nossa região. Um centro em Tubarão e filas de exame e cirurgia que não obriguem ninguém a parcelar no cartão.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"background:#ffffff; border:1px solid #e3e9f6; border-radius:16px; padding:32px 28px; display:flex; flex-direction:column; gap:14px; box-shadow:0 6px 22px rgba(12,26,48,0.05)\" class=\"card\">\n          <span style=\"width:44px; height:44px; border-radius:10px; background:#f2c200; color:#0a2a5e; font-weight:900; font-size:19px; display:flex; align-items:center; justify-content:center\">03<\u002Fspan>\n          <h3 style=\"margin:0; font-size:22px; line-height:1.22; font-weight:900; color:#0a2a5e; letter-spacing:-0.5px\">AMUREL no mapa dos investimentos<\u002Fh3>\n          <p style=\"margin:0; font-size:16px; line-height:1.6; color:#5c6b85; text-wrap:pretty\">18 cidades, quase 300 mil eleitores e nenhum deputado federal daqui. A região já sabe o que precisa: SC-370, gás, porto e turismo.<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"regiao\" class=\"sec\" style=\"background:linear-gradient(135deg,#0a2a5e 0%,#12469a 100%); color:#ffffff; padding:86px 22px\">\n    <div style=\"max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:40px\">\n      <div style=\"display:flex; flex-direction:column; gap:16px; max-width:740px\">\n        <span style=\"color:#ffd63d; font-size:13px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase\">A região<\u002Fspan>\n        <h2 class=\"h2\" style=\"margin:0; font-size:42px; line-height:1.08; font-weight:900; letter-spacing:-1.2px\">18 cidades, uma só voz em Brasília<\u002Fh2>\n        <p class=\"lead\" style=\"margin:0; font-size:19px; line-height:1.6; color:rgba(255,255,255,0.84)\">A AMUREL nunca teve um deputado federal próprio. Chegou a hora de mudar isso.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"stats-grid\" style=\"display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px\">\n        <div style=\"background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16); border-radius:16px; padding:30px\">\n          <div class=\"stat-num\" style=\"font-size:56px; font-weight:900; color:#f2c200; line-height:1; letter-spacing:-2px\">18<\u002Fdiv>\n          <div style=\"margin-top:10px; font-size:16px; font-weight:700; color:rgba(255,255,255,0.9)\">cidades da AMUREL<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16); border-radius:16px; padding:30px\">\n          <div class=\"stat-num\" style=\"font-size:56px; font-weight:900; color:#f2c200; line-height:1; letter-spacing:-2px\">~300 mil<\u002Fdiv>\n          <div style=\"margin-top:10px; font-size:16px; font-weight:700; color:rgba(255,255,255,0.9)\">eleitores na região<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16); border-radius:16px; padding:30px\">\n          <div class=\"stat-num\" style=\"font-size:56px; font-weight:900; color:#f2c200; line-height:1; letter-spacing:-2px\">0<\u002Fdiv>\n          <div style=\"margin-top:10px; font-size:16px; font-weight:700; color:rgba(255,255,255,0.9)\">deputados federais da região hoje<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <blockquote class=\"quote\" style=\"margin:0; border-left:6px solid #f2c200; padding:8px 0 8px 26px; font-size:24px; line-height:1.42; font-weight:800; letter-spacing:-0.4px; max-width:900px; text-wrap:pretty\">“A região já sabe do que precisa: SC-370, gás, porto e turismo. Falta quem leve isso pra Brasília.”<\u002Fblockquote>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"contato\" class=\"sec\" style=\"background:#f6f8fd; padding:86px 22px\">\n    <div style=\"max-width:820px; margin:0 auto; display:flex; flex-direction:column; align-items:center; text-align:center; gap:18px\">\n      <h2 class=\"h2\" style=\"margin:0; font-size:40px; line-height:1.1; font-weight:900; letter-spacing:-1.1px; color:#0c1a30; text-wrap:balance\">Compartilhe com quem também quer mais pra nossa região<\u002Fh2>\n      <p class=\"lead\" style=\"margin:0; font-size:19px; line-height:1.6; color:#5c6b85\">Siga, compartilhe e ajude a levar essas pautas pra mais gente.<\u002Fp>\n      <div class=\"cta-row\" style=\"display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin-top:12px\">\n        <a class=\"cta-btn\" href=\"https://wa.me/5548999578769\" target=\"_blank\" rel=\"noopener\" style=\"background:#f2c200; color:#0c1a30; font-weight:800; font-size:16px; padding:15px 26px; border-radius:10px\" style-hover=\"background:#ffd63d\">WhatsApp (48) 99957-8769<\u002Fa>\n        <a class=\"cta-btn\" href=\"mailto:contato@engenheirasilvanasilvano.com.br\" style=\"background:#0a2a5e; color:#ffffff; font-weight:800; font-size:16px; padding:15px 26px; border-radius:10px; overflow-wrap:anywhere\" style-hover=\"background:#12469a\">contato@engenheirasilvanasilvano.com.br<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"cta-row\" style=\"display:flex; flex-wrap:wrap; justify-content:center; gap:14px\">\n        <a class=\"cta-btn\" href=\"https://instagram.com\" target=\"_blank\" rel=\"noopener\" style=\"border:2px solid #0a2a5e; color:#0a2a5e; font-weight:800; font-size:16px; padding:13px 26px; border-radius:10px\" style-hover=\"background:#0a2a5e; color:#ffffff\">Instagram<\u002Fa>\n        <a class=\"cta-btn\" href=\"https://facebook.com\" target=\"_blank\" rel=\"noopener\" style=\"border:2px solid #0a2a5e; color:#0a2a5e; font-weight:800; font-size:16px; padding:13px 26px; border-radius:10px\" style-hover=\"background:#0a2a5e; color:#ffffff\">Facebook<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#0c1a30; color:rgba(255,255,255,0.72); padding:44px 22px\">\n    <div style=\"max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:14px; font-size:14px; line-height:1.6\">\n      <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:#ffffff; font-weight:800; font-size:15px\">\n        <span>Engenheira Silvana Silvano<\u002Fspan>\n        <span style=\"opacity:0.35\">·<\u002Fspan>\n        <span>Candidata a Deputada Federal por Santa Catarina<\u002Fspan>\n        <span style=\"background:#f2c200; color:#0a2a5e; padding:2px 8px; border-radius:5px; font-weight:900\">7712<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0; max-width:780px\">Propaganda eleitoral. Pago por: Eleição 2026 Silvana da Silva Silvano Deputado Federal — CNPJ 68.607.990/0001-64.<\u002Fp>\n      <p style=\"margin:0; max-width:780px\">Rua Manoel Saturnino de Godoy, 65, Casa — Passagem, Tubarão/SC — CEP 88705-570<\u002Fp>\n      <p style=\"margin:0; display:flex; flex-wrap:wrap; gap:6px 16px\"><a href=\"mailto:contato@engenheirasilvanasilvano.com.br\" style=\"color:#ffd63d; overflow-wrap:anywhere\">contato@engenheirasilvanasilvano.com.br<\u002Fa><a href=\"https://wa.me/5548999578769\" target=\"_blank\" rel=\"noopener\" style=\"color:#ffd63d\">(48) 99957-8769<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  \n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = { shared: false };\n  renderVals() {\n    return {\n      shareLabel: this.state.shared ? \"Link copiado!\" : \"Compartilhe a campanha\",\n      compartilhar: async () => {\n        const data = {\n          title: \"Engenheira Silvana Silvano 7712\",\n          text: \"A voz da AMUREL em Brasília é a 7712.\",\n          url: typeof location !== \"undefined\" ? location.href : \"\"\n        };\n        try {\n          if (navigator.share) { await navigator.share(data); return; }\n          await navigator.clipboard.writeText(data.url);\n        } catch (e) {}\n        this.setState({ shared: true });\n        setTimeout(() => this.setState({ shared: false }), 2200);\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
